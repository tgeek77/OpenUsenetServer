# Copy to config.yml for local runs. Docker Compose injects the same
# values via environment variables — you do not need inn.conf.

server:
  hostname: news.localhost
  organization: OpenUsenetServer
  # Path header token. Defaults to hostname if omitted.
  pathhost: news.localhost

listen:
  nntp: ":1119" # use :119 in Docker; 1119 avoids root on a laptop
  http: ":8080" # admin portal (login required after first admin exists)
  # nntp_tls: ":563"
  # http_tls: ":8443"

# tls:
#   cert_file: /etc/openusenet/fullchain.pem
#   key_file: /etc/openusenet/privkey.pem

storage:
  postgres: postgres://openusenet:openusenet@127.0.0.1:5432/openusenet?sslmode=disable
  mbox_dir: ./archive # live append-on-POST spool (not IA exports)

# Not enforced: live articles are kept indefinitely. Use archive exports for snapshots.
retention:
  live_days: 30
  history_days: 60

limits:
  max_art_size: 5000000
  idle_seconds: 180

# Extra groups beyond the ISC list (always seeded).
groups:
  - name: local.test
    description: Local test group
    status: y

# Canonical public list: https://ftp.isc.org/usenet/CONFIG/
# Fetched on `openusenet migrate`, and on first `serve` if the DB is empty.
groups_source:
  isc_url: https://ftp.isc.org/usenet/CONFIG
  # fetch_isc: false   # set to skip the ISC pull (tests / airgap)

# YAML peers seed the DB only when the peers table is empty. Prefer the admin UI afterward.
# peers:
#   - host: news-b
#     port: 119
#   - host: news-c
#     port: 119

# Who may IHAVE to us (INN incoming.conf model).
# - require_peer_auth: true — only configured peers, must AUTHINFO PASS first (password: in incoming.conf).
# - With no allow list and no peers configured: all remotes (dev default).
# - With peers in the admin UI: enabled peer hostnames are allowed (DNS-resolved).
# - Set open: false to reject everyone not listed below or configured as a peer.
# inbound:
#   require_peer_auth: true
#   open: false
#   allow:
#     - 192.168.1.0/24

# Cleanfeed-ng is installed in the Docker image (see Dockerfile).
# Enabled by default in docker-compose via OPENUSENET_CLEANFEED=true.
# cleanfeed:
#   enabled: true
#   mode: reject
#   command: perl /usr/local/lib/openusenet/cleanfeed-filter.pl
#   script: /usr/local/lib/cleanfeed-ng/cleanfeed
#   config_dir: /usr/local/lib/cleanfeed-ng/etc

# TOP1000 path statistics (required by many peers, e.g. Eternal September).
# Path headers are logged on POST/IHAVE; flush dumps and mail reports to top1000@anthologeek.net.
# inpaths:
#   enabled: true
#   dir: ./pathlog
#   schedule: daily          # auto-flush; add report.smtp_host to auto-send
#   report:
#     mailto:
#       - top1000@anthologeek.net
#       - admin@example.org   # Cc yourself to verify non-empty output
#     smtp_host: smtp.example.org
#     smtp_port: 587

# Snapshot exports (mbox.gz). Never deletes live articles.
archive:
  export_dir: ./exports
  # schedule: weekly   # daily | weekly | empty to disable
  groups: all
  retain_generations: 4
