<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenUsenet admin</title>
<style>
:root {
  --bg: #12141a;
  --panel: #1b1f2a;
  --ink: #e8eadf;
  --muted: #9aa3b5;
  --line: #2a3140;
  --accent: #c4f542;
  --warn: #ffb020;
  --bad: #ff6b6b;
  --ok: #6ee7a8;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 15px/1.45 "IBM Plex Sans", "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--ink);
}
header {
  padding: 1.25rem 1.5rem 0.75rem;
  border-bottom: 1px solid var(--line);
}
header h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.04em; }
header p { margin: 0.25rem 0 0; color: var(--muted); font-size: 0.9rem; }
.warn {
  margin: 0.75rem 1.5rem 0;
  padding: 0.5rem 0.75rem;
  background: #3a2a12;
  color: var(--warn);
  border: 1px solid #5a4018;
  font-size: 0.85rem;
}
main { padding: 1rem 1.5rem 2.5rem; display: grid; gap: 1.25rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.75rem; }
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 0.85rem 1rem;
}
.card .n { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.card .l { color: var(--muted); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em; }
section {
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 1rem;
}
section h2 { margin: 0 0 0.75rem; font-size: 1rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-bottom: 0.75rem; }
input, select, button {
  font: inherit;
  background: #10131a;
  color: var(--ink);
  border: 1px solid var(--line);
  padding: 0.4rem 0.6rem;
}
button { background: var(--accent); color: #12141a; border: 0; font-weight: 600; cursor: pointer; }
button.secondary { background: transparent; color: var(--ink); border: 1px solid var(--line); }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
.dot { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; margin-right: 0.35rem; }
.up { background: var(--ok); }
.down { background: var(--bad); }
.mono { font-family: ui-monospace, "IBM Plex Mono", monospace; font-size: 0.82rem; }
pre {
  white-space: pre-wrap;
  background: #10131a;
  padding: 0.75rem;
  border: 1px solid var(--line);
  max-height: 24rem;
  overflow: auto;
}
</style>
</head>
<body>
<header>
  <h1>OpenUsenet</h1>
  <p id="sub">admin portal</p>
</header>
<div class="warn">Authentication is not enabled. Anyone who can reach this port can administer the server.</div>
<main>
  <div class="cards" id="cards"></div>
  <section>
    <h2>Peers</h2>
    <table>
      <thead><tr><th>Status</th><th>Host</th><th>Port</th><th>Note</th></tr></thead>
      <tbody id="peers"></tbody>
    </table>
    <p class="mono" id="feed"></p>
  </section>
  <section>
    <h2>Groups</h2>
    <div class="row">
      <input id="gq" placeholder="search name…" size="24">
      <label><input type="checkbox" id="busy" checked> with articles</label>
      <button class="secondary" id="gsearch">Search</button>
    </div>
    <div class="row">
      <input id="gname" placeholder="new group name" size="22">
      <input id="gdesc" placeholder="description" size="28">
      <select id="gstat"><option value="y">y posting</option><option value="n">n no post</option><option value="m">m moderated</option></select>
      <button id="gadd">Add group</button>
      <button class="secondary" id="isc">Pull ISC list</button>
    </div>
    <p class="mono" id="gmsg"></p>
    <table>
      <thead><tr><th>Name</th><th>Status</th><th>Count</th><th>High</th><th>Description</th></tr></thead>
      <tbody id="groups"></tbody>
    </table>
  </section>
  <section>
    <h2>Recent articles</h2>
    <table>
      <thead><tr><th>When</th><th>Message-ID</th><th>From</th><th>Subject</th></tr></thead>
      <tbody id="arts"></tbody>
    </table>
    <pre id="art" hidden></pre>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
async function j(url, opt) {
  const r = await fetch(url, opt);
  const t = await r.text();
  let d;
  try { d = JSON.parse(t); } catch { throw new Error(t); }
  if (!r.ok) throw new Error(d.error || t);
  return d;
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
}
async function loadStatus() {
  const s = await j("/api/status");
  $("sub").textContent = s.hostname + " · " + s.software + " " + s.version + " · nntp " + s.listen_nntp + " · http " + s.listen_http;
  $("cards").innerHTML = [
    ["Groups", s.groups],
    ["Articles", s.articles],
    ["Peers", (s.peers||[]).length],
    ["Feed OK", s.feed && s.feed.ok],
    ["Feed fail", s.feed && s.feed.fail],
  ].map(([l,n]) => `<div class="card"><div class="n">${esc(n)}</div><div class="l">${esc(l)}</div></div>`).join("");
  $("peers").innerHTML = (s.peer_status||[]).map(p =>
    `<tr><td><span class="dot ${p.up ? "up":"down"}"></span>${p.up?"up":"down"}</td><td class="mono">${esc(p.host)}</td><td>${esc(p.port)}</td><td class="mono">${esc(p.error||"")}</td></tr>`
  ).join("") || `<tr><td colspan="4">No peers configured</td></tr>`;
  $("feed").textContent = s.feed && s.feed.last ? ("last IHAVE " + s.feed.last) : "";
}
async function loadGroups() {
  const q = encodeURIComponent($("gq").value);
  const busy = $("busy").checked ? "1" : "0";
  const d = await j("/api/groups?q="+q+"&busy="+busy);
  $("groups").innerHTML = (d.groups||[]).map(g =>
    `<tr><td class="mono">${esc(g.name)}</td><td>${esc(g.status)}</td><td>${esc(g.count)}</td><td>${esc(g.high)}</td><td>${esc(g.description)}</td></tr>`
  ).join("") || `<tr><td colspan="5">No groups match</td></tr>`;
}
async function loadArts() {
  const d = await j("/api/articles");
  $("arts").innerHTML = (d.articles||[]).map(a =>
    `<tr data-id="${esc(a.message_id)}"><td class="mono">${esc(a.stored_at)}</td><td class="mono">${esc(a.message_id)}</td><td>${esc(a.from)}</td><td>${esc(a.subject)}</td></tr>`
  ).join("") || `<tr><td colspan="4">No articles yet</td></tr>`;
}
$("gsearch").onclick = loadGroups;
$("gq").addEventListener("keydown", e => { if (e.key==="Enter") loadGroups(); });
$("gadd").onclick = async () => {
  $("gmsg").textContent = "";
  try {
    await j("/api/groups", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({
      name: $("gname").value, description: $("gdesc").value, status: $("gstat").value
    })});
    $("gmsg").textContent = "added " + $("gname").value;
    $("busy").checked = false;
    $("gq").value = $("gname").value;
    await loadGroups();
    await loadStatus();
  } catch (e) { $("gmsg").textContent = e.message; }
};
$("isc").onclick = async () => {
  $("gmsg").textContent = "pulling ISC list…";
  try {
    const d = await j("/api/isc", {method:"POST"});
    $("gmsg").textContent = "loaded " + d.loaded + " groups from ISC";
    await loadStatus();
    await loadGroups();
  } catch (e) { $("gmsg").textContent = e.message; }
};
$("arts").addEventListener("click", async (e) => {
  const tr = e.target.closest("tr[data-id]");
  if (!tr) return;
  const d = await j("/api/article?id="+encodeURIComponent(tr.dataset.id));
  $("art").hidden = false;
  $("art").textContent = (d.headers||"") + "\n\n" + (d.body||"");
});
async function boot() {
  try { await Promise.all([loadStatus(), loadGroups(), loadArts()]); }
  catch (e) { $("sub").textContent = e.message; }
}
boot();
setInterval(() => { loadStatus(); loadArts(); }, 15000);
</script>
</body>
</html>
