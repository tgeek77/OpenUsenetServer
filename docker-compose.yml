services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openusenet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openusenet}
      POSTGRES_DB: ${POSTGRES_DB:-openusenet}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openusenet} -d ${POSTGRES_DB:-openusenet}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  openusenet:
    image: ${OPENUSENET_IMAGE:-jsevans/openusenet:0.5.0}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "0.0.0.0:119:119"
      # Admin HTTP is local-only; public HTTPS goes through Caddy on 443.
      - "127.0.0.1:8080:8080"
    environment:
      OPENUSENET_HOSTNAME: ${OPENUSENET_HOSTNAME:-news.localhost}
      OPENUSENET_ORGANIZATION: ${OPENUSENET_ORGANIZATION:-OpenUsenetServer}
      OPENUSENET_LISTEN: ${OPENUSENET_LISTEN:-:119}
      OPENUSENET_HTTP: ${OPENUSENET_HTTP:-:8080}
      # Same credentials as the postgres service. Do not set a separate DSN in .env.
      POSTGRES_USER: ${POSTGRES_USER:-openusenet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openusenet}
      POSTGRES_DB: ${POSTGRES_DB:-openusenet}
      POSTGRES_HOST: postgres
      OPENUSENET_POSTGRES: postgres://${POSTGRES_USER:-openusenet}:${POSTGRES_PASSWORD:-openusenet}@postgres:5432/${POSTGRES_DB:-openusenet}?sslmode=disable
      OPENUSENET_MBOX_DIR: ${OPENUSENET_MBOX_DIR:-/var/spool/openusenet/archive}
      OPENUSENET_EXPORT_DIR: ${OPENUSENET_EXPORT_DIR:-/var/spool/openusenet/exports}
      OPENUSENET_BOOTSTRAP_ADMIN: ${OPENUSENET_BOOTSTRAP_ADMIN:-}
      OPENUSENET_INBOUND_OPEN: ${OPENUSENET_INBOUND_OPEN:-}
      OPENUSENET_INBOUND_ALLOW: ${OPENUSENET_INBOUND_ALLOW:-}
      OPENUSENET_REQUIRE_PEER_AUTH: ${OPENUSENET_REQUIRE_PEER_AUTH:-}
      OPENUSENET_CLEANFEED: ${OPENUSENET_CLEANFEED:-true}
      OPENUSENET_CLEANFEED_MODE: ${OPENUSENET_CLEANFEED_MODE:-reject}
      OPENUSENET_CLEANFEED_COMMAND: ${OPENUSENET_CLEANFEED_COMMAND:-perl /usr/local/lib/openusenet/cleanfeed-filter.pl}
      OPENUSENET_CLEANFEED_SCRIPT: ${OPENUSENET_CLEANFEED_SCRIPT:-/usr/local/lib/cleanfeed-ng/cleanfeed}
      OPENUSENET_CLEANFEED_CONFIG_DIR: ${OPENUSENET_CLEANFEED_CONFIG_DIR:-/usr/local/lib/cleanfeed-ng/etc}
    volumes:
      - archive:/var/spool/openusenet/archive
      - exports:/var/spool/openusenet/exports
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "openusenet", "healthcheck", "--addr", "127.0.0.1:119"]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # HTTPS for the admin portal. Public FQDN → Let's Encrypt; localhost → internal CA.
  # See docs/tls.md. NNTPS (563) is not handled here yet.
  caddy:
    image: caddy:2-alpine
    depends_on:
      openusenet:
        condition: service_healthy
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "0.0.0.0:443:443/udp"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      # :z is required for rootless Podman + SELinux (otherwise: permission denied).
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata: {}
  archive: {}
  exports: {}
  caddy_data: {}
  caddy_config: {}
